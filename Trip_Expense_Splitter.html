<h1>🧳 Trip Expense Splitter</h1>
<div class="card row">
 <select id="evsel" style="flex:1;min-width:140px"></select>

<script>
const $=s=>document.querySelector(s),K='tripSplitterV1',BASE='NPR';
const CATS=['Lodging','Food','Transport','Entry fee','Shopping','Activities','Personal','Other'];
const TYPES={all:'Common – equal to all',some:'Specific friends – equal',personal:'Personal – one person only',ratio:'Custom ratio',amount:'Custom amounts'};
const uid=()=>'i'+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
let S=(()=>{try{const j=JSON.parse(localStorage.getItem(K));if(j&&Array.isArray(j.events)&&j.events.length)return j}catch(e){}
 const id=uid();return{cur:{NPR:1,INR:1.6,USD:135},events:[{id,name:'My Trip',friends:[],expenses:[]}],sel:id,tab:'exp',disp:BASE}})();
let editId=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const E=()=>S.events.find(e=>e.id===S.sel)||S.events[0];
const nm=(e,id)=>(e.friends.find(f=>f.id===id)||{}).name||'?';
const norm=x=>{if(!x.payers||typeof x.payers!=='object'||Array.isArray(x.payers))x.payers={};if(!Object.keys(x.payers).length&&x.payer)x.payers={[x.payer]:x.amount||0};const p=Object.create(null);for(const k in x.payers){const key=String(k);if(key!=='')p[key]=Math.max(0,+x.payers[k]||0)}if(!Object.keys(p).length&&x.payer!=null&&x.payer!=='')p[String(x.payer)]=Math.max(0,+x.amount||0);x.payers=p;x.payer=Object.keys(p)[0];x.members=(Array.isArray(x.members)?x.members:[]).filter(i=>i!=null&&i!=='').map(String);const v=Object.create(null);if(x.vals&&typeof x.vals==='object'&&!Array.isArray(x.vals))for(const k in x.vals){const key=String(k);if(key!=='')v[key]=Math.max(0,+x.vals[k]||0)}x.vals=v;x.id=x.id==null||x.id===''?uid():String(x.id);x.date=x.date||today();x.desc=String(x.desc??'');x.cat=CATS.includes(x.cat)?x.cat:'Other';x.cur=String(x.cur||BASE).trim().toUpperCase()||BASE;x.amount=Math.max(0,+x.amount||0);x.rate=+x.rate||0;if(x.cur===BASE)x.rate=1;if(!TYPES[x.type])x.type='all';return x};
const clean=j=>{if(!j.last||typeof j.last!=='object'||Array.isArray(j.last))j.last={};const c=Object.create(null);if(j.cur&&typeof j.cur==='object'&&!Array.isArray(j.cur))for(const k in j.cur){const r=+j.cur[k],code=String(k).trim().toUpperCase();if(code&&r>0)c[code]=r}if(!Object.keys(c).length){c.NPR=1;c.INR=1.6;c.USD=135}c.NPR=1;j.cur=c;if(!Array.isArray(j.last.members))j.last.members=[];else j.last.members=j.last.members.filter(i=>i!=null&&i!=='').map(String);if(!TYPES[j.last.type])j.last.type='all';if(!CATS.includes(j.last.cat))j.last.cat=CATS[0];
 j.events=(Array.isArray(j.events)?j.events:[]).filter(e=>e&&typeof e==='object').map(e=>({id:e.id==null||e.id===''?uid():String(e.id),name:String(e.name??'Untitled'),friends:(Array.isArray(e.friends)?e.friends:[]).filter(f=>f&&f.id!=null&&f.id!=='').map(f=>({id:String(f.id),name:String(f.name??'')})),expenses:(Array.isArray(e.expenses)?e.expenses:[]).filter(x=>x&&typeof x==='object')}));
 j.events.forEach(e=>e.expenses.forEach(norm));if(!j.events.length){const id=uid();j.events.push({id,name:'My Trip',friends:[],expenses:[]});j.sel=id}
 const se=new Set();j.events.forEach(e=>{if(se.has(e.id))e.id=uid();se.add(e.id);const sf=new Set(),sx=new Set();e.friends.forEach(f=>{if(sf.has(f.id))f.id=uid();sf.add(f.id)});e.expenses.forEach(x=>{if(sx.has(x.id))x.id=uid();sx.add(x.id);if(x.cur===BASE)x.rate=1;else{if(!j.cur[x.cur])j.cur[x.cur]=x.rate>0?x.rate:1;if(!(x.rate>0))x.rate=j.cur[x.cur]||1}})});const lc=String(j.last.cur||'').trim().toUpperCase();j.last.cur=j.cur[lc]?lc:BASE;
 const dc=String(j.disp||'').trim().toUpperCase();j.disp=j.cur[dc]?dc:BASE;if(j.sel!=null)j.sel=String(j.sel);if(!['exp','fr','sum','cur','bk'].includes(j.tab))j.tab='exp';return j};S=clean(S);
const payLbl=(x,e)=>{const k=Object.keys(x.payers);return k.map(i=>nm(e,i)+(k.length>1?' '+fm(x.payers[i]):'')).join(', ')};
function toast(m,act){const t=$('#toast');t.textContent=m;if(act){const b=document.createElement('button');b.textContent=act[0];b.onclick=()=>{t.style.display='none';act[1]()};t.appendChild(b)}t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',act?6000:3200)}
function modal(msg,inp){return new Promise(r=>{const d=$('#dlg');d.returnValue='';d.innerHTML=`<form method="dialog"><p>${esc(msg)}</p>${inp!==undefined?`<input id="di" value="${esc(inp)}" autofocus>`:''}<div class="row" style="justify-content:flex-end"><button value="n" class="g">Cancel</button><button value="y">OK</button></div></form>`;const di=$('#di');if(di)di.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();d.querySelector('button[value="y"]').click()}};d.onclose=()=>r(d.returnValue==='y'?(inp!==undefined?$('#di').value.trim():true):null);d.showModal()})}
/* ---------- calculation ---------- */
function shares(x,e){const n=x.amount*(x.rate||1),o=Object.create(null),v=x.vals||{},ids=x.type==='all'?e.friends.map(f=>f.id):x.members;
 if(x.type==='ratio'){const t=ids.reduce((a,i)=>a+(+v[i]||0),0)||1;ids.forEach(i=>o[i]=n*(+v[i]||0)/t)}
 else if(x.type==='amount')ids.forEach(i=>o[i]=(+v[i]||0)*(x.rate||1));
 else ids.forEach(i=>o[i]=n/(ids.length||1));return o}
function calc(e){const f=Object.create(null);e.friends.forEach(x=>f[x.id]={paid:0,share:0});
 const rows=e.expenses.map(x=>{const rt=x.rate||1,n=x.amount*rt,sh=shares(x,e),pay=Object.create(null);for(const k in x.payers){pay[k]=x.payers[k]*rt;if(f[k])f[k].paid+=pay[k]}for(const k in sh)if(f[k])f[k].share+=sh[k];return{x,n,sh,pay}});
 return{f,rows,total:rows.reduce((a,r)=>a+r.n,0)}}
function settle(e,c){const d=e.friends.map(f=>({id:f.id,n:f.name,b:c.f[f.id].paid-c.f[f.id].share}));
 const cr=d.filter(x=>x.b>.005).sort((a,b)=>b.b-a.b),db=d.filter(x=>x.b<-.005).map(x=>({id:x.id,n:x.n,b:-x.b})).sort((a,b)=>b.b-a.b),out=[];let i=0,j=0;
 while(i<db.length&&j<cr.length){const a=Math.min(db[i].b,cr[j].b);out.push({from:db[i].n,to:cr[j].n,fromId:db[i].id,toId:cr[j].id,amt:a});db[i].b-=a;cr[j].b-=a;if(db[i].b<.005)i++;if(cr[j].b<.005)j++}return out}
const splitLbl=(x,e)=>{const n=x.members.map(i=>nm(e,i));return({all:'Equal – all',some:'Equal – '+n.join(', '),personal:'Personal – '+n[0],ratio:'Ratio '+n.map((a,k)=>a+' '+(x.vals[x.members[k]]??0)).join(' : '),amount:'Custom – '+n.map((a,k)=>a+' '+fm(x.vals[x.members[k]])).join(', ')})[x.type]||''};
/* ---------- render ---------- */
function render(){const e=E();S.sel=e.id;
 $('#evsel').innerHTML=S.events.map(x=>`<option value="${esc(x.id)}" ${x.id===e.id?'selected':''}>${esc(x.name)}</option>`).join('');
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
 ({exp:rExp,fr:rFr,sum:rSum,cur:rCur,bk:rBk})[S.tab](e);save()}
function renderSplit(t,mem=[],vals={}){const e=E();$('#fsplit').innerHTML=t==='all'?`<span class="mu">Divided equally among all ${e.friends.length} friends.</span>`:
 e.friends.map(f=>`<div class="mrow"><label><input type="${t==='personal'?'radio':'checkbox'}" name="m" data-m="${esc(f.id)}" ${mem.includes(f.id)?'checked':''}> ${esc(f.name)}</label>${t==='ratio'||t==='amount'?`<input type="number" step="any" min="0" data-v="${esc(f.id)}" value="${vals[f.id]??(t==='ratio'?1:'')}" placeholder="${t==='ratio'?'share':'amount'}">`:''}</div>`).join('')+
 (t==='ratio'?'<small class="mu">Ratio: tick friends and enter shares, e.g. 2 : 1.</small>':t==='amount'?'<small class="mu">Amounts are in the expense currency and must add up to the total.</small>':'')}
function rExp(e){const cs=Object.keys(S.cur);
 $('#main').innerHTML=`<div class="card"><h3 id="ftitle">Add expense</h3>${e.friends.length?'':'<p class="neg">Add friends first (Friends tab).</p>'}<div class="grid">
 <label>Date<span class="row" style="flex-wrap:nowrap"><input type="date" id="fd" style="flex:1"><button type="button" class="s g" data-dt="0">Today</button><button type="button" class="s g" data-dt="-1">Yest.</button></span></label><label>Description<input id="fn" placeholder="e.g. Hotel room" list="dl" autocomplete="off"><datalist id="dl">${[...new Set(S.events.flatMap(z=>z.expenses.map(x=>x.desc)))].map(d=>`<option value="${esc(d)}">`).join('')}</datalist></label>
 <label>Category<select id="fc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label>
 <label>Paid by<select id="fp">${e.friends.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('')}</select></label>
 <label class="chk" style="align-self:end"><input type="checkbox" id="fmulti"> Multiple payers</label><label>Amount<input type="number" step="any" min="0" id="fa"></label>
 <label>Currency<select id="fcur">${cs.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label>
 <label>Rate (1 unit = ? NPR)<input type="number" step="any" id="fr"></label>
 <label>Split type<select id="ft">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label></div>
 <div class="chips">${CATS.map(c=>`<button type="button" class="g" data-cat="${c}">${c}</button>`).join('')}</div><div id="fpay" class="split" style="display:none"></div><div id="fsplit" class="split"></div><div class="row"><button id="fsave">Save expense</button><button class="g" id="fclr">Clear</button></div></div>
 <div class="card"><div class="row filt"><h3>Expenses</h3><select id="qc"><option value="">All categories</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><select id="qf"><option value="">All friends</option>${e.friends.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('')}</select><input id="q" placeholder="Search…"></div><div id="list" class="tw"></div></div>`;
 fillForm(e.expenses.find(x=>x.id===editId));
 $('#fcur').onchange=()=>{$('#fr').value=S.cur[$('#fcur').value];$('#fr').disabled=$('#fcur').value===BASE};
 $('#ft').onchange=()=>renderSplit($('#ft').value,[],{});
 $('#q').oninput=rList;$('#qc').onchange=rList;$('#qf').onchange=rList;$('#fsave').onclick=saveExp;$('#fclr').onclick=()=>{editId=null;fillForm()};
 $('#fmulti').onchange=()=>payUI();$('#fn').onchange=autofill;['fn','fa'].forEach(i=>$('#'+i).onkeydown=k=>{if(k.key==='Enter')saveExp()});rList()}
function fillForm(x,asNew){const e=E(),L=S.last||{},ids=x?Object.keys(x.payers):[];editId=x&&!asNew?x.id:null;$('#ftitle').textContent=x?(asNew?'New expense (copy)':'Edit expense'):'Add expense';
 $('#fd').value=x&&!asNew?x.date:today();$('#fn').value=x?x.desc:'';$('#fc').value=x?x.cat:(L.cat||CATS[0]);
 const pid=ids[0]&&e.friends.some(f=>f.id===ids[0])?ids[0]:(e.friends.some(f=>f.id===L.payer)?L.payer:'');if(pid)$('#fp').value=pid;$('#fmulti').checked=ids.length>1;
 $('#fa').value=x?x.amount:'';$('#fcur').value=x?x.cur:(L.cur&&S.cur[L.cur]?L.cur:BASE);$('#fr').value=x?x.rate:S.cur[$('#fcur').value];$('#ft').value=x?x.type:(L.type||'all');
 $('#fr').disabled=$('#fcur').value===BASE;renderSplit($('#ft').value,x?x.members:(L.members||[]),x?x.vals:{});payUI(x?x.payers:undefined)}
function readPay(){const on=new Set([...document.querySelectorAll('[data-pc]:checked')].map(i=>i.dataset.pc)),o=Object.create(null);document.querySelectorAll('[data-p]').forEach(i=>{if(!on.has(i.dataset.p))return;const v=parseFloat(i.value);if(v>0)o[i.dataset.p]=v});return o}
function payUI(pay){const e=E(),m=$('#fmulti').checked,d=$('#fpay');$('#fp').parentElement.style.display=m?'none':'';d.style.display=m?'':'none';if(!m)return;
 pay=pay||Object.assign(Object.create(null),{[$('#fp').value]:parseFloat($('#fa').value)||0});
 d.innerHTML=e.friends.map(f=>`<div class="mrow"><label><input type="checkbox" data-pc="${esc(f.id)}" ${pay[f.id]?'checked':''}> ${esc(f.name)}</label><input type="number" step="any" min="0" data-p="${esc(f.id)}" value="${pay[f.id]||''}" placeholder="paid"></div>`).join('')+'<div class="row"><button type="button" class="s g" id="peq">Split paid amount equally among ticked</button><small class="mu">Paid amounts must add up to the total.</small></div>';
 $('#peq').onclick=()=>{const a=parseFloat($('#fa').value)||0,ids=[...d.querySelectorAll('[data-pc]:checked')].map(i=>i.dataset.pc);if(!ids.length)return toast('Tick who paid');const each=a/ids.length,inputs={};d.querySelectorAll('[data-p]').forEach(i=>inputs[i.dataset.p]=i);let s=0;ids.forEach((id,k)=>{const v=k===ids.length-1?+(a-s).toFixed(2):+each.toFixed(2);s+=v;if(inputs[id])inputs[id].value=v.toFixed(2)})}}
function autofill(){if(editId)return;const e=E(),v=$('#fn').value.trim().toLowerCase(),p=[...e.expenses].reverse().find(x=>x.desc.toLowerCase()===v);if(!p)return;

 if(D.dup){fillForm(e.expenses.find(x=>x.id===D.dup),true);toast('Copied into the form with today’s date — change what differs and Save');return scrollTo(0,0)}
 if(D.del){const i=e.expenses.findIndex(x=>x.id===D.del);if(i<0)return;const x=e.expenses[i];e.expenses.splice(i,1);if(editId===D.del)editId=null;render();return toast('Expense deleted',['Undo',()=>{e.expenses.splice(i,0,x);render()}])}
 if(D.fren){const f=e.friends.find(x=>x.id===D.fren);if(!f)return;const v=await modal('Rename friend',f.name);if(v){if(e.friends.some(z=>z!==f&&z.name.toLowerCase()===v.toLowerCase()))return toast('Name already exists');f.name=v;render()}return}
 if(D.fdel){if(e.expenses.some(x=>(x.payers&&Object.prototype.hasOwnProperty.call(x.payers,D.fdel))||(Array.isArray(x.members)&&x.members.includes(D.fdel))))return toast('This friend is used in expenses — edit or delete those first');e.friends=e.friends.filter(x=>x.id!==D.fdel);return render()}
 if(D.cdel){if(S.events.some(z=>z.expenses.some(x=>x.cur===D.cdel)))return toast('Currency is used in expenses');delete S.cur[D.cdel];if(S.disp===D.cdel)S.disp=BASE;if(S.last&&S.last.cur===D.cdel)S.last.cur=BASE;return render()}
 if(t.id==='evnew'){const v=await modal('New event name','');if(v){const id=uid();S.events.push({id,name:v,friends:[],expenses:[]});S.sel=id;render()}}
 if(t.id==='evren'){const v=await modal('Rename event',e.name);if(v){e.name=v;render()}}
 if(t.id==='evdel'){if(S.events.length<2)return toast('Keep at least one event');if(await modal(`Delete event “${e.name}” with all its expenses?`)){S.events=S.events.filter(x=>x.id!==e.id);S.sel=S.events[0].id;editId=null;render()}}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='evsel'){S.sel=t.value;editId=null;render()}
 if(t.dataset.rate){const r=parseFloat(t.value);if(r>0){S.cur[t.dataset.rate]=r;save();toast('Rate updated — use “Re-apply” to update old expenses')}else{toast('Invalid rate');render()}}});
render();
</script></body></html>
